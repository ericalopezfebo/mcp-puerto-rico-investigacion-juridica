services:
  mcp-investigacion-juridica:
    build:
      context: https://github.com/ericalopezfebo/mcp-puerto-rico-investigacion-juridica.git#main
    container_name: mcp-investigacion-juridica-pr
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8000"
      MCP_API_KEY: "${MCP_API_KEY:?MCP_API_KEY is required}"
      MCP_ALLOWED_HOSTS: "${MCP_ALLOWED_HOSTS:-localhost,localhost:*,127.0.0.1,127.0.0.1:*}"
      MCP_ALLOWED_ORIGINS: "${MCP_ALLOWED_ORIGINS:-http://localhost:8000}"
