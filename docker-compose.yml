services:
  mcp-investigacion-juridica:
    build:
      context: https://github.com/ericalopezfebo/mcp-puerto-rico-investigacion-juridica.git#main
    container_name: mcp-investigacion-juridica-pr
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      # Loopback only. Publish externally through an authenticated HTTPS reverse proxy.
      - "127.0.0.1:8000:8000"
    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8000"
      MCP_ALLOWED_HOSTS: "${MCP_ALLOWED_HOSTS:?configure exact HTTPS hostnames}"
      MCP_ALLOWED_ORIGINS: "${MCP_ALLOWED_ORIGINS:?configure exact HTTPS origins}"
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
