[project]
name = "mcp-puerto-rico-sentencias"
version = "0.6.0"
description = "MCP local-first para proteger documentos legales, preparar texto anonimizado para IA y consultar jurisprudencia de Puerto Rico."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "MCP Puerto Rico Sentencias contributors" },
]
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.28,<2",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "pypdf>=5.0.0",
  "python-docx>=1.1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.urls]
Repository = "https://github.com/ericalopezfebo/mcp-puerto-rico-sentencias"
Issues = "https://github.com/ericalopezfebo/mcp-puerto-rico-sentencias/issues"

[project.scripts]
mcp-puerto-rico-sentencias = "server:main"
velum = "velum:main"
velum-local = "velum_local:main"

[tool.setuptools]
py-modules = ["server", "velum", "velum_local"]
packages = ["mcp_server", "mcp_server.sources"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
