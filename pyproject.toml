[project]
name = "mcp-puerto-rico-investigacion-juridica"
version = "0.15.0"
description = "MCP de investigación jurídica de Puerto Rico para buscar y verificar jurisprudencia, legislación, reglamentos, decisiones administrativas y actualidad jurídica pública desde Claude, ChatGPT y otros clientes MCP."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "MCP Puerto Rico — Investigación Jurídica contributors" },
]
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.28.1,<2",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "pypdf>=5.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.urls]
Repository = "https://github.com/ericalopezfebo/mcp-puerto-rico-investigacion-juridica"
Issues = "https://github.com/ericalopezfebo/mcp-puerto-rico-investigacion-juridica/issues"

[project.scripts]
mcp-puerto-rico-investigacion-juridica = "bootstrap_server:main"
mcp-puerto-rico-investigacion-juridica-remote = "bootstrap_remote:main"
# Backward-compatible aliases so existing Claude/ChatGPT configurations keep working.
mcp-puerto-rico-sentencias = "bootstrap_server:main"
mcp-puerto-rico-sentencias-remote = "bootstrap_remote:main"

[tool.setuptools]
py-modules = ["server", "research_server", "smart_server", "search_tuning", "doctrine_ontology", "corpus_index", "corpus_runtime", "authority_reader", "jrt_server", "vigencia_server", "legislative_graph", "mixed_server", "remote_server", "bootstrap_server", "bootstrap_remote"]

[tool.setuptools.package-data]
"*" = ["data/*.jsonl"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_server*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
