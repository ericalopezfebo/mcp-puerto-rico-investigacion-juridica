[project]
name = "mcp-puerto-rico-sentencias"
version = "0.6.0"
description = "MCP multiplataforma para investigar derecho de Puerto Rico desde fuentes públicas verificables: jurisprudencia, órdenes ejecutivas, apelaciones y actualidad jurídica."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "MCP Puerto Rico Sentencias contributors" },
]
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.28.1,<2",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "pypdf>=5.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.urls]
Repository = "https://github.com/ericalopezfebo/mcp-puerto-rico-sentencias"
Issues = "https://github.com/ericalopezfebo/mcp-puerto-rico-sentencias/issues"

[project.scripts]
mcp-puerto-rico-sentencias = "legal_portal:main"
mcp-puerto-rico-sentencias-remote = "remote_server:main"

[tool.setuptools]
py-modules = ["server", "legal_portal", "remote_server"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
