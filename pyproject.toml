[project]
name = "mcp-puerto-rico-sentencias"
version = "0.3.0"
description = "MCP para Claude que busca y lee sentencias de Puerto Rico, localiza precedentes verificables y extrae texto exacto con trazabilidad de fuente."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "MCP Puerto Rico Sentencias contributors" },
]
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.0.0",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "pypdf>=5.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.urls]
Repository = "https://github.com/ericalopezfebo/mcp-puerto-rico-sentencias"
Issues = "https://github.com/ericalopezfebo/mcp-puerto-rico-sentencias/issues"

[project.scripts]
mcp-puerto-rico-sentencias = "server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
