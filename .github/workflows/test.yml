name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[test]"
      - name: Import smoke test
        run: python -c "import server, research_server, smart_server, remote_server; print('imports ok')"
      - name: Run tests
        run: pytest -q
      - name: Build Docker image
        run: docker build -t mcp-puerto-rico-investigacion-juridica:test .
