name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[test]"
      - name: Import smoke test
        run: python -c "import server, research_server, smart_server, search_tuning, doctrine_ontology, corpus_index, corpus_runtime, authority_reader, jrt_server, vigencia_server, legislative_graph, mixed_server, remote_server, bootstrap_server, bootstrap_remote; print('imports ok', bootstrap_server.VERSION)"
      - name: Offline corpus smoke test
        run: python -c "import corpus_index; r=corpus_index.search_corpus('jurisdicción primaria exclusiva concurrente pericia administrativa', list(range(1997,2027)), 10); assert len(r)>=3; print([x[0].citation for x in r])"
      - name: Run tests
        run: pytest -q
      - name: Build Docker image
        run: docker build -t mcp-puerto-rico-investigacion-juridica:test .
